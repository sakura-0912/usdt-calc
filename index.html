<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1119">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="购汇计算">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>卡片购汇成本计算器</title>
<style>
  :root{
    --bg:#0b1119; --panel:#15212e; --panel2:#192838; --field:#1b2a3a;
    --line:#26384b; --fg:#e9eff6; --muted:#8ba1b6; --dim:#54697e;
    --accent:#35d0c0; --accent2:#28b7a9; --warn:#ff8f8f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--fg);
    background:
      radial-gradient(1100px 620px at 50% -12%, #17293b 0%, rgba(23,41,59,0) 62%),
      radial-gradient(760px 440px at 104% 112%, #12293a 0%, rgba(18,41,58,0) 60%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px 18px;
  }
  .wrap{width:100%; max-width:470px;}
  h1{font-size:22px; margin:0 0 6px; font-weight:700; letter-spacing:.5px;}
  .sub{font-size:12px; color:var(--muted); margin:0 0 18px;}
  .card{
    background:linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    border:1px solid #1e2f41; border-radius:16px;
    padding:18px 16px; margin-bottom:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 14px 30px -20px rgba(0,0,0,.95);
  }
  .row{display:flex; align-items:center; gap:14px;}
  .row + .row{margin-top:13px;}
  .row > span.name{
    font-size:13.5px; white-space:nowrap; flex:0 0 auto; width:92px; color:#cfdbe7;
  }
  .field{
    position:relative; flex:1 1 auto; min-width:0;
    display:flex; align-items:stretch;
    background:var(--field); border:1px solid var(--line); border-radius:10px;
    overflow:hidden;
    transition:border-color .16s, box-shadow .16s, background .16s;
  }
  .field:focus-within{
    border-color:var(--accent); background:#1f3042;
    box-shadow:0 0 0 3px rgba(53,208,192,.13);
  }
  .field input{
    flex:1 1 auto; min-width:0; width:100%;
    background:transparent; border:0; outline:none; color:var(--fg); caret-color:var(--accent);
    padding:10px 10px 10px 12px; font-size:17px; text-align:right;
    font-family:Consolas,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums;
  }
  .field input::placeholder{color:#4d637a;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .unit{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    min-width:94px;
    padding:0 8px; font-size:11px; font-style:normal; color:var(--muted);
    background:rgba(255,255,255,.03);
    border-left:1px solid var(--line);
    white-space:nowrap; letter-spacing:.25px;
  }
  .unit .arw{color:var(--accent); opacity:.8; font-weight:600; margin:0 3px;}
  .label{font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:.3px;}
  .big{
    font-size:42px; font-weight:700; color:var(--accent); line-height:1.12;
    font-variant-numeric:tabular-nums; letter-spacing:.6px;
    font-family:"Microsoft YaHei UI",system-ui,sans-serif;
    text-shadow:0 0 26px rgba(53,208,192,.22);
  }
  .detail{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.75;}
  .detail b{color:#c2d2e1; font-weight:600; font-variant-numeric:tabular-nums;}
  .err{font-size:12px; color:var(--warn); margin-top:6px; min-height:16px;}
  .note{font-size:11px; color:var(--dim); margin-top:2px; line-height:1.5;}
  .detail .up{color:#ffb35c;}
  .detail .down{color:#5fd6a4;}
  .actions{display:flex; align-items:center; gap:10px; margin-top:2px;}
  button{
    font-family:inherit; font-size:14px; border-radius:11px; border:1px solid transparent;
    padding:11px 22px; cursor:pointer; transition:filter .15s, background .15s, transform .08s;
  }
  button:active{transform:translateY(1px);}
  button.primary{
    background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
    color:#05231f; font-weight:700;
    box-shadow:0 8px 20px -12px rgba(53,208,192,.9);
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{background:var(--field); color:var(--fg); border-color:var(--line);}
  button.ghost:hover{background:#243547;}
  .tip{font-size:12px; color:var(--accent); opacity:0; transition:opacity .2s;}
  .tip.show{opacity:1;}
  .foot{font-size:11px; color:var(--dim); margin:14px 2px 0; line-height:1.6;}
  @media (max-width:420px){
    body{padding:18px 12px;}
    h1{font-size:19px;}
    .big{font-size:34px;}
    .card{padding:15px 13px; border-radius:14px;}
    .row{gap:10px;}
    .row > span.name{width:80px; font-size:12.5px;}
    .field input{font-size:16px; padding:9px 8px 9px 10px;}
    .unit{min-width:82px; padding:0 5px; font-size:10.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>卡片购汇成本计算器</h1>
  <p class="sub">所需人民币 = 美元金额 × U 单价 ÷ 卡片折算率</p>

  <section class="card">
    <div class="row">
      <span class="name">目标美元金额</span>
      <span class="field">
        <input id="x" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
        <i class="unit">USD</i>
      </span>
    </div>
    <div class="row">
      <span class="name">USDT 买入单价</span>
      <span class="field">
        <input id="p" type="text" inputmode="decimal" autocomplete="off" placeholder="0.0000">
        <i class="unit">CNY<b class="arw">→</b>USDT</i>
      </span>
    </div>
    <div class="row">
      <span class="name">卡片折算率</span>
      <span class="field">
        <input id="r" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        <i class="unit">USDT<b class="arw">→</b>USD</i>
      </span>
    </div>
    <div class="row">
      <span class="name">真实汇率</span>
      <span class="field">
        <input id="f" type="text" inputmode="decimal" autocomplete="off" placeholder="7.1000">
        <i class="unit">CNY<b class="arw">→</b>USD</i>
      </span>
    </div>
  </section>

  <section class="card">
    <div class="label">实际花费人民币</div>
    <div class="big" id="out">¥ —</div>
    <div class="detail" id="detail"></div>
    <div class="note" id="note"></div>
    <div class="err" id="err"></div>
  </section>

  <div class="actions">
    <button class="primary" id="copy">复制结果</button>
    <button class="ghost" id="reset">清空</button>
    <span class="tip" id="tip"></span>
  </div>

  <p class="foot">单价取 Gate C2C 卖出 USDT 的实时价。真实汇率填银行现汇卖出价或中间价。溢价差 = 有效汇率 − 真实汇率，正数表示比真实汇率更贵；没填折算率时，直接用 USDT 单价与真实汇率比较。</p>
</div>

<script>
(function () {
  "use strict";

  var $x = document.getElementById("x");
  var $p = document.getElementById("p");
  var $r = document.getElementById("r");
  var $f = document.getElementById("f");
  var $out = document.getElementById("out");
  var $detail = document.getElementById("detail");
  var $note = document.getElementById("note");
  var $err = document.getElementById("err");
  var $tip = document.getElementById("tip");
  var last = null;
  var tipTimer = null;

  function parseNum(text) {
    if (text == null) return null;
    var s = String(text).replace(/[,，%\s]/g, "");
    if (!s) return null;
    var v = Number(s);
    return isFinite(v) ? v : null;
  }

  function normalizeRate(raw) {
    if (raw == null || raw <= 0) return null;
    return raw > 1 ? raw / 100 : raw;
  }

  function fmt(v, digits) {
    return v.toLocaleString("zh-CN", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
  }

  function compute() {
    var xRaw = $x.value.trim(), pRaw = $p.value.trim(),
        rRaw = $r.value.trim(), fRaw = $f.value.trim();

    var x = parseNum($x.value);
    var p = parseNum($p.value);
    var rNum = parseNum($r.value);
    var r = normalizeRate(rNum);
    var real = parseNum($f.value);

    // 只有「填了但不合法」才报错；留空不算错
    if (xRaw && x === null) return { err: "目标美元金额不是数字" };
    if (x !== null && x <= 0) return { err: "目标美元金额要大于 0" };
    if (pRaw && p === null) return { err: "USDT 单价不是数字" };
    if (p !== null && p <= 0) return { err: "USDT 单价要大于 0" };
    if (rRaw && rNum === null) return { err: "卡片折算率不是数字" };
    if (rNum !== null && rNum <= 0) return { err: "卡片折算率要大于 0" };
    if (fRaw && real === null) return { err: "真实汇率不是数字" };
    if (real !== null && real <= 0) return { err: "真实汇率要大于 0" };

    var hasP = p !== null, hasR = r !== null, hasX = x !== null, hasF = real !== null;

    var eff = (hasP && hasR) ? p / r : null;              // 有效汇率 CNY / USD
    var y = (hasX && hasP && hasR) ? x * p / r : null;    // 实付人民币
    var face = (hasX && hasR) ? x / r : null;             // 需购买 USDT 数量

    // 溢价差：有折算率时用有效汇率，没有折算率时直接用 USDT 单价对真实汇率
    var prem = null, premPct = null, premBase = null;
    if (hasP && hasF) {
      premBase = hasR ? eff : p;
      prem = premBase - real;
      premPct = (premBase / real - 1) * 100;
    }

    return {
      x: x, p: p, r: r, real: real,
      hasX: hasX, hasP: hasP, hasR: hasR, hasF: hasF,
      eff: eff, y: y, face: face,
      prem: prem, premPct: premPct, premBase: premBase
    };
  }

  function render() {
    var res = compute();

    if (res.err) {
      last = null;
      $out.textContent = "¥ —";
      $detail.innerHTML = "";
      $note.textContent = "";
      $err.textContent = res.err;
      return;
    }
    $err.textContent = "";

    var parts = [];
    if (res.face !== null) parts.push("需购买 <b>" + fmt(res.face, 2) + " USDT</b>");
    if (res.eff !== null) parts.push("有效汇率 <b>" + fmt(res.eff, 4) + " CNY → USD</b>");
    if (res.prem !== null) {
      var up = res.prem >= 0;
      var sg = up ? "+" : "−";
      parts.push("溢价差 <b class=\"" + (up ? "up" : "down") + "\">" + sg +
        fmt(Math.abs(res.prem), 4) + "（" + sg + fmt(Math.abs(res.premPct), 2) + "%）</b>");
    }
    $detail.innerHTML = parts.join(" &nbsp;·&nbsp; ");
    $out.textContent = (res.y !== null) ? ("¥ " + fmt(res.y, 2)) : "¥ —";

    if (res.y === null && res.prem !== null) {
      $note.textContent = res.hasR
        ? "未填目标美元金额，仅显示汇率与溢价"
        : "未填目标金额和折算率，仅按 USDT 单价计算溢价差";
    } else if (res.y !== null && res.prem === null) {
      $note.textContent = "填「真实汇率」可显示溢价差";
    } else {
      $note.textContent = "";
    }

    last = (res.y !== null || res.prem !== null) ? res : null;
  }

  function save() {
    try {
      localStorage.setItem("uc_x", $x.value);
      localStorage.setItem("uc_p", $p.value);
      localStorage.setItem("uc_r", $r.value);
      localStorage.setItem("uc_f", $f.value);
    } catch (e) {}
  }

  function load() {
    try {
      $x.value = localStorage.getItem("uc_x") || "";
      $p.value = localStorage.getItem("uc_p") || "";
      $r.value = localStorage.getItem("uc_r") || "";
      $f.value = localStorage.getItem("uc_f") || "";
    } catch (e) {}
  }

  // 支持链接带参数：?x=10&p=6.69&r=80&f=7.10
  function fromQuery() {
    try {
      var q = new URLSearchParams(location.search);
      ["x", "p", "r", "f"].forEach(function (k) {
        if (q.has(k)) {
          var el = document.getElementById(k);
          if (el) el.value = q.get(k);
        }
      });
    } catch (e) {}
  }

  function showTip(text) {
    $tip.textContent = text;
    $tip.classList.add("show");
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { $tip.classList.remove("show"); }, 1600);
  }

  function copyResult() {
    if (!last) { showTip("还没有可复制的结果"); return; }

    var bits = [];
    if (last.y !== null) {
      bits.push("目标 " + fmt(last.x, 2) + " USD → 实付 ¥" + fmt(last.y, 2) +
        "（需购买 " + fmt(last.face, 2) + " USDT）");
    } else if (last.hasX) {
      bits.push("目标 " + fmt(last.x, 2) + " USD");
    }
    if (last.eff !== null) bits.push("有效汇率 " + fmt(last.eff, 4));
    if (last.prem !== null) {
      var sg = last.prem >= 0 ? "+" : "-";
      bits.push("溢价差 " + sg + fmt(Math.abs(last.prem), 4) +
        "（" + sg + fmt(Math.abs(last.premPct), 2) + "%）");
    }
    var text = bits.join("，");

    function done() { showTip("已复制"); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { showTip("复制失败，请手动选中"); }
      document.body.removeChild(ta);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  [$x, $p, $r, $f].forEach(function (el) {
    el.addEventListener("input", function () { render(); save(); });
    el.addEventListener("focus", function () { el.select(); });
  });

  document.getElementById("copy").addEventListener("click", copyResult);

  document.getElementById("reset").addEventListener("click", function () {
    $x.value = ""; $p.value = ""; $r.value = ""; $f.value = "";
    render(); save();
    $x.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); copyResult(); }
  });

  load();
  fromQuery();
  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
